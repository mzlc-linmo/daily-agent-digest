name: Build release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile tray UI
        shell: powershell
        run: .\native\windows\build.ps1
      - name: Verify tray binary
        shell: powershell
        run: if (!(Test-Path native/windows/build/DailyAgentDigestTray.exe)) { throw 'tray binary missing' }
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyinstaller==6.16.0
      - name: Run core protocol tests
        run: python -m unittest discover -s tests -v
      - name: UI smoke test (Swift compile + outcome mapping)
        run: bash native/macos/ui-smoke-test.sh
      - name: Build and optionally sign
        timeout-minutes: 8
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DIGEST_RELEASE_VERSION: ${{ github.ref_name }}
          SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: daily-agent-digest-macos-${{ matrix.arch }}
          path: |
            dist/daily-agent-digest-macos-${{ matrix.arch }}
            dist/Daily-Agent-Digest-${{ matrix.arch }}-app.zip
          if-no-files-found: error
      - name: Submit and wait for Apple notarization
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 25
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci-notarize.sh
      - name: Preserve notarization metadata
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarization-${{ matrix.arch }}/
          if-no-files-found: warn
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - name: Prepare distribution assets
        run: |
          cp install.sh dist/install.sh
          for app in dist/Daily\ Agent\ Digest\ *.app; do [ -d "$app" ] && (cd dist && zip -qr "$(basename "$app" .app | tr ' ' '-')-app.zip" "$(basename "$app")"); done
          for archive in dist/Daily-Agent-Digest-*-app.zip; do
            audit_dir=$(mktemp -d)
            unzip -q "$archive" -d "$audit_dir"
            app=$(find "$audit_dir" -name DailyAgentDigest -type f | head -1)
            test -n "$app"
            echo "archive=$(basename "$archive")"
            echo "ui_binary_sha256=$(sha256sum "$app" | awk '{print $1}')"
            info=$(find "$audit_dir" -name Info.plist -type f | head -1)
            test -n "$info"
            grep -a -q 'DigestUIBuildID' "$info"
          done
          cd dist
          sha256sum daily-agent-digest-macos-* *.zip > SHA256SUMS
      - name: Publish signed release or unsigned draft
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
          GH_REPO: mzlc-linmo/daily-agent-digest-distribution
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') }}
          BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$RELEASE_SIGNED" = true ]; then
            gh release create "$RELEASE_REF" dist/daily-agent-digest-* dist/Daily-Agent-Digest-*-app.zip dist/install.sh dist/SHA256SUMS --target main --title "$RELEASE_REF" --notes 'Developer ID signed and notarized macOS binaries and menu-bar app. Requires macOS 15 or newer and zstd for DeepSeek Harness logs.'
          else
            gh release create "ci-$BUILD_NUMBER" dist/daily-agent-digest-* dist/Daily-Agent-Digest-*-app.zip dist/install.sh dist/SHA256SUMS --draft --prerelease --title "CI verification $BUILD_NUMBER" --notes 'Unsigned build for private verification only. Not a public installable release. Run a version tag after configuring Apple signing secrets to publish.'
          fi
