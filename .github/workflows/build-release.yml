name: Build release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pyinstaller
      - run: pyinstaller --onefile --name daily-agent-digest-macos-${{ matrix.arch }} daily_agent_digest.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-agent-digest-macos-${{ matrix.arch }}
          path: dist/daily-agent-digest-macos-${{ matrix.arch }}
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: dist/*, generate_release_notes: true}
