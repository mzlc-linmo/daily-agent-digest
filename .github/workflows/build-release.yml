name: Build release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile tray UI
        shell: powershell
        run: .\native\windows\build.ps1
      - name: Verify tray binary
        shell: powershell
        run: if (!(Test-Path native/windows/build/DailyAgentDigestTray.exe)) { throw 'tray binary missing' }
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyinstaller==6.16.0
      - name: Run core protocol tests
        run: python -m unittest discover -s tests -v
      - name: UI smoke test (Swift compile + outcome mapping)
        run: bash native/macos/ui-smoke-test.sh
      - name: Build and optionally sign
        timeout-minutes: 8
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DIGEST_RELEASE_VERSION: ${{ github.ref_name }}
          SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci-build.sh
      - name: Submit and wait for Apple notarization
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 25
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # DMG 需要签名,这一步要自己拿到身份与证书
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-notarize.sh
      # 必须排在公证之后:DMG 是公证步骤里制作、签名、公证并装订的,放在前面会上传不到。
      - uses: actions/upload-artifact@v4
        with:
          name: daily-agent-digest-macos-${{ matrix.arch }}
          path: |
            dist/daily-agent-digest-macos-${{ matrix.arch }}
            dist/Daily-Agent-Digest-${{ matrix.arch }}-app.zip
            dist/Daily-Agent-Digest-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - name: Preserve notarization metadata
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarization-${{ matrix.arch }}/
          if-no-files-found: warn
  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - name: Prepare distribution assets
        env:
          RELEASE_SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          cp install.sh dist/install.sh
          for app in dist/Daily\ Agent\ Digest\ *.app; do [ -d "$app" ] && (cd dist && zip -qr "$(basename "$app" .app | tr ' ' '-')-app.zip" "$(basename "$app")"); done
          for archive in dist/Daily-Agent-Digest-*-app.zip; do
            audit_dir=$(mktemp -d)
            unzip -q "$archive" -d "$audit_dir"
            app=$(find "$audit_dir" -name DailyAgentDigest -type f | head -1)
            test -n "$app"
            echo "archive=$(basename "$archive")"
            echo "ui_binary_sha256=$(sha256sum "$app" | awk '{print $1}')"
            info=$(find "$audit_dir" -name Info.plist -type f | head -1)
            test -n "$info"
            grep -a -q 'DigestUIBuildID' "$info"
          done
          cd dist
          # 显式收集真实存在的文件,不再依赖 shell glob 展开:
          # 文件缺失时旧写法只会得到一句难懂的 "no matches found"。
          files=()
          for f in daily-agent-digest-macos-* *.zip *.dmg install.sh; do [ -e "$f" ] && files+=("$f"); done
          [ "${#files[@]}" -gt 0 ]
          sha256sum "${files[@]}" > SHA256SUMS
          printf 'asset: %s\n' "${files[@]}" SHA256SUMS
          if [ "$RELEASE_SIGNED" = true ]; then
            # 签名发布必须每个架构一个可拖拽安装的 DMG,否则整轮线上发布会缺交付物。
            dmgs=()
            for f in *.dmg; do [ -e "$f" ] && dmgs+=("$f"); done
            if [ "${#dmgs[@]}" -lt 2 ]; then
              echo "签名发布要求每个架构各一个 DMG,实际只有 ${#dmgs[@]} 个" >&2
              exit 1
            fi
          fi
      - name: Publish signed release or unsigned draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mzlc-linmo/daily-agent-digest
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') }}
          BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -eu
          cd dist
          assets=()
          for f in daily-agent-digest-macos-* *.zip *.dmg install.sh SHA256SUMS; do [ -e "$f" ] && assets+=("$f"); done
          [ "${#assets[@]}" -gt 0 ] || { echo '没有可发布的产物' >&2; exit 1; }
          if [ "$RELEASE_SIGNED" = true ]; then
            tag="$RELEASE_REF"
            create_args=(--target main --title "$RELEASE_REF")
            notes='Developer ID signed and notarized macOS binaries, drag-to-Applications DMG and menu-bar app. Requires macOS 15 or newer and zstd for DeepSeek Harness logs.'
          else
            tag="ci-$BUILD_NUMBER"
            create_args=(--draft --prerelease --title "CI verification $BUILD_NUMBER")
            notes='Unsigned build for private verification only. Not a public installable release. Run a version tag after configuring Apple signing secrets to publish.'
          fi
          # 重跑同一个 tag 必须可行:release 已存在时改为覆盖同名产物,而不是直接失败。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag 已存在:覆盖产物并更新说明"
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" "${create_args[@]}" --notes "$notes"
          fi
